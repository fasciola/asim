name: Add Four Pillars footer credit

on:
  push:
    paths:
      - '.github/workflows/add-four-pillars-credit.yml'

permissions:
  contents: write

jobs:
  patch-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add Four Pillars credit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          css_marker = '        .footer-copyright {\n'
          credit_css = (
              '        .footer-meta {\n'
              '            display: flex;\n'
              '            flex-direction: column;\n'
              '            align-items: center;\n'
              '            gap: 0.75rem;\n'
              '        }\n\n'
              '        .footer-credit {\n'
              '            display: inline-flex;\n'
              '            align-items: center;\n'
              '            gap: 0.5rem;\n'
              '            color: var(--text-tertiary);\n'
              '            text-decoration: none;\n'
              '            font-size: 0.62rem;\n'
              '            letter-spacing: 0.12em;\n'
              '            opacity: 0.75;\n'
              '            transition: color 0.3s ease, opacity 0.3s ease;\n'
              '        }\n\n'
              '            .footer-credit:hover {\n'
              '                color: var(--cyan-accent);\n'
              '                opacity: 1;\n'
              '            }\n\n'
              '            .footer-credit img {\n'
              '                height: 20px;\n'
              '                width: auto;\n'
              '                display: block;\n'
              '            }\n\n'
              '        @media (min-width: 768px) {\n'
              '            .footer-meta {\n'
              '                align-items: flex-end;\n'
              '            }\n'
              '        }\n\n'
          )

          if '.footer-credit {' not in html:
              if css_marker not in html:
                  raise SystemExit('Footer copyright CSS marker not found')
              html = html.replace(css_marker, credit_css + css_marker, 1)

          old_footer = '                <div class="footer-copyright" data-en="© 2026 ASEM VISION. All Rights Reserved." data-ar="© 2026 عاصم فيجن. جميع الحقوق محفوظة.">© 2026 ASEM VISION. All Rights Reserved.</div>'
          new_footer = (
              '                <div class="footer-meta">\n'
              '                    <div class="footer-copyright" data-en="© 2026 ASEM VISION. All Rights Reserved." data-ar="© 2026 عاصم فيجن. جميع الحقوق محفوظة.">© 2026 ASEM VISION. All Rights Reserved.</div>\n'
              '                    <a class="footer-credit" href="https://4pillarsweb.online/" target="_blank" rel="noopener noreferrer" aria-label="Website by Four Pillars Web Design">\n'
              '                        <span>Website by Four Pillars</span>\n'
              '                        <img src="https://4pillarsweb.online/logo.png" alt="Four Pillars Web Design" loading="lazy">\n'
              '                    </a>\n'
              '                </div>'
          )

          if 'Website by Four Pillars' not in html:
              if old_footer not in html:
                  raise SystemExit('Footer copyright HTML marker not found')
              html = html.replace(old_footer, new_footer, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit footer credit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/add-four-pillars-credit.yml
          git add index.html .github/workflows/add-four-pillars-credit.yml
          git commit -m "Add Four Pillars website credit to footer"
          git push
